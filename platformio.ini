; MIMXRT1062DVL6B on the Teensy 4.1 core. The board has no PJRC bootloader chip, so "upload" goes through a
; J-Link on the SWD header. Without one, flash the .hex with NXP's ROM serial downloader (hold BOOT while pressing
; RESET) and MCUXpresso Secure Provisioning or blhost.
[env:MIMXRT1062]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
	adafruit/Adafruit Unified Sensor@^1.1.15
	adafruit/Adafruit BNO08x@^1.2.5
	adafruit/Adafruit BMP280 Library@^3.0.0
	sparkfun/SparkFun BMP581 Arduino Library@^1.0.2
	robtillaart/I2C_EEPROM@^1.9.4
	lordmax2/klevebrand-all-drone-controller-core@^3.0.4
	lordmax2/klevebrand-skywire-framework@^2.0.0
	lordmax2/klevebrand-drone-position-bmp280-neom9n@^3.2.0
	sparkfun/SparkFun u-blox GNSS v3@^3.1.14
	; Not used (the BNO085 is on SPI), but the position library's example main.cpp includes it
	lordmax2/klevebrand-drone-gyro-bno085@^3.0.0
upload_protocol = jlink
monitor_speed = 115200
monitor_filters = default, log2file
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++20 -DSKYWIRE_EXPERIMENTAL

