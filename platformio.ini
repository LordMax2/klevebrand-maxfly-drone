; MIMXRT1062DVL6B on the Teensy 4.1 core. The board has no PJRC bootloader chip, so "upload" goes through a
; J-Link on the SWD header. Without one, flash the .hex with NXP's ROM serial downloader (hold BOOT while pressing
; RESET) and MCUXpresso Secure Provisioning or blhost.
[env:MIMXRT1062]
platform = teensy
board = teensy41
framework = arduino
lib_deps =
	robtillaart/I2C_EEPROM@^1.9.4
	; Core 4.0.0 (TemplateDrone takes the gyro and position) from the sibling checkout until it is published. The
	; components name the core without its owner for now, so this local copy satisfies them.
	symlink://../klevebrand-all-drone-controller
	lordmax2/klevebrand-skywire-framework@^2.0.0
	; Libraries in this repository until they get packages of their own. Each library.json lists its dependencies.
	symlink://components/klevebrand-drone-gyro-bno085-spi
	symlink://components/klevebrand-drone-position-bmp581-neom9n
upload_protocol = jlink
monitor_speed = 115200
monitor_filters = default, log2file
build_unflags = -std=gnu++11 -std=gnu++14 -std=gnu++17
build_flags = -std=gnu++20 -DSKYWIRE_EXPERIMENTAL

